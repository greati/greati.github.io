---
layout: publication-page
---

<div class="pure-g">
	<div class="pure-u-1">
		<article class="post">
			<header>
				<h3>{{ page.title }}</h3>
                            <div class="pub-authors">{{page.authors}}</div>
                            <div class="pub-where">{{page.where}}</div>
			    <div class="buttons-bar">
				    {% if page.pdf %}
				    <span class="pdf-link"><a target="_blank" href="{{page.pdf}}">PDF</a></span>
				    {% endif %}
				    {% if page.doi %}
				    <span class="doi-link"><a target="_blank" href="http://doi.org/{{page.doi}}">DOI</a></span>
				    {% endif %}
				    {% if page.preprint %}
				    <span class="preprint-link"><a target="_blank" href="http://{{page.preprint}}">PREPRINT</a></span>
				    {% endif %}
		            </div>
			</header>

			<div class="entry">
				{{ content }}
			</div>
		</article>
	</div>
</div>
